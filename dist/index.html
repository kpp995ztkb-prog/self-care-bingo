<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf5e9"><title>自我关爱 Bingo</title><meta name="description" content="挑选九件关爱自己的小事，制作属于你的自我关爱宾果卡。"><link rel="stylesheet" href="style.css?v=20261023-guide"></head><body>

<main class="plan-main"><section class="plan-heading"><div class="care-tag" aria-hidden="true"><img class="self-love-word" src="assets/self-love.png" alt=""></div><h1><span class="sr-only">自我关爱 Bingo</span><img class="bingo-word" src="assets/bingo-collage.png?v=2" alt=""><span class="heading-star star-left" aria-hidden="true">✧</span><span class="heading-star star-right" aria-hidden="true">✧</span></h1><p id="modeGuide">点击卡片替换，长按拖动换位。</p></section>
<section class="board-section"><div class="board-toolbar" hidden><div class="filters" role="group" aria-label="筛选卡片类型"><button data-filter="all" class="active">全部 <small>9</small></button><button data-filter="record">记录型</button><button data-filter="goal">目标型</button><button data-filter="reward">奖励型</button></div></div><div class="grid" id="grid"></div>
<div class="plan-buttons"><button class="secondary" id="shuffle" title="重新抽取卡片并重置点亮记录">⤨ 随机换一组</button><button class="primary" id="edit">确认</button></div><p id="completeHint" class="gentle-note" hidden>填满九宫格，就可以完成计划。</p>
<div id="playActions" class="actions" hidden><button id="share" class="secondary">↗ 分享给朋友</button><button id="download" class="primary">↓ 下载我的卡片</button></div></section><div class="scrapbook-note" aria-hidden="true"><span>今天</span><span>也要</span><span>好好</span><span>爱自己</span></div></main>
<dialog id="modal"><button id="close" class="close" aria-label="关闭">×</button><div id="modalContent"></div></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
